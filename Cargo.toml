# Pure workspace manifest - no [package] here. The `gel` crate itself now
# lives in gel-lib/ (a plain `git = "..."` dependency, like ivy's, resolves
# it there fine by package name alone - confirmed empirically, no `path`
# or `package` field needed on the consumer side). Sibling tools that build
# on `gel` but shouldn't bloat its own dependency list live alongside it:
# gel-mcp and gel-cli.
[workspace]
members = ["gel-lib", "gel-mcp", "gel-cli"]
resolver = "3"
