<svg xmlns="http://www.w3.org/2000/svg" width="10in" height="6in" viewBox="0 0 10 6">
  <!-- 6x2in: survives a 0.63in corner radius (2r = 1.26 < 2) -->
  <path d="M 1 1 L 7 1 L 7 3 L 1 3 Z" fill="none" stroke="black" stroke-width="0.01"/>
  <!-- 4x1in: does NOT (2r = 1.26 > 1). Exists to make the Assert fire. -->
  <path d="M 1 4 L 5 4 L 5 5 L 1 5 Z" fill="none" stroke="black" stroke-width="0.01"/>
</svg>
